name: Build aarch64

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04
    env:
      EMULATION_DEVICE: no
      ENABLE_32BIT: no
      MODULES_PKG: no
      JAVA_HOME: /usr
      AUTOREMOVE: "yes"
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: ${{ inputs.DEVICE == 'AMD64' && 'x86_64' || 'aarch64' }}
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-base-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Retrieve ccache
        run: |
          BASE="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache"
          if [ "${{ inputs.DEVICE }}" = "AMD64" ]; then
            PREFIX="ccache-aarch64-${{ inputs.DEVICE }}.tar.part-"
            for suffix in $(printf "%s\n" {a..z}{a..z}); do
              curl -L --fail --silent --show-error -o "${PREFIX}${suffix}" "${BASE}/${PREFIX}${suffix}" || { rm -f "${PREFIX}${suffix}"; break; }
            done
            if ls ${PREFIX}* >/dev/null 2>&1; then
              cat ${PREFIX}* | tar -xf - && rm -f ${PREFIX}*
            else
              echo "Cache archive not found, skipping."
            fi
          else
            curl -L --fail --silent --show-error "${BASE}/ccache-aarch64-${{ inputs.DEVICE }}.tar" | tar -xvf - || echo "Cache archive not found, skipping."
          fi

      - name: Download aarch64-toolchain (${{ inputs.DEVICE }})
        uses: actions/download-artifact@v8
        with:
          name: aarch64-toolchain (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64-toolchain
        run: |
          tar --zstd -xf build.aarch64-toolchain.tar.zst

      - name: Clean up compressed aarch64-toolchain file
        run: rm build.aarch64-toolchain.tar.zst

      - name: Build
        # Stop in time to save the cache below: a first AMD64 build doesn't fit in one 6 h job.
        timeout-minutes: ${{ inputs.DEVICE == 'AMD64' && 300 || 360 }}
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_distro "; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-aarch64
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.${{ env.ARCH }}/.threads/logs/

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ROCKNIX-base-image-${{ inputs.DEVICE }}-${{ env.DATE }}
          path: |
            target/ROCKNIX-*.img.gz
            target/ROCKNIX-*.img.gz.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Build modules
        if: ${{ inputs.DEVICE == 'RK3326' || inputs.DEVICE == 'H700' }}
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt modules "; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-modules)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-modules
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.${{ env.ARCH }}/.threads/logs/

      - name: Clean ccache
        if: ${{ success() || (failure() && inputs.DEVICE == 'AMD64') }}
        run: |
          docker ps -q | xargs -r docker kill || true
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.${{ env.ARCH }}/.ccache
          ./build.ROCKNIX-${{ inputs.DEVICE }}.${{ env.ARCH }}/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.${{ env.ARCH }}/toolchain/bin/ccache -M ${{ inputs.DEVICE == 'AMD64' && '6G' || '2G' }}
          ./build.ROCKNIX-${{ inputs.DEVICE }}.${{ env.ARCH }}/toolchain/bin/ccache -c
          ./build.ROCKNIX-${{ inputs.DEVICE }}.${{ env.ARCH }}/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.${{ env.ARCH }}/toolchain/bin/ccache -z

      - name: Tar ccache
        if: ${{ success() || (failure() && inputs.DEVICE == 'AMD64') }}
        run: |
          if [ "${{ inputs.DEVICE }}" = "AMD64" ]; then
            tar --remove-files -cf - ./build.ROCKNIX-${{ inputs.DEVICE }}.${{ env.ARCH }}/.ccache \
              | split -b 1900m - ccache-aarch64-${{ inputs.DEVICE }}.tar.part-
          else
            tar --remove-files -cf ccache-aarch64-${{ inputs.DEVICE }}.tar ./build.ROCKNIX-${{ inputs.DEVICE }}.${{ env.ARCH }}/.ccache
          fi

      - name: Save ccache
        if: ${{ success() || (failure() && inputs.DEVICE == 'AMD64') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: ccache-aarch64-${{ inputs.DEVICE }}.tar*
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Print space
        run: df -h

      - name: Compress directory
        run: |
          sudo tar --remove-files \
          -cf build.build.aarch64.tar ./build.ROCKNIX-${{ inputs.DEVICE }}.${{ env.ARCH }}/build
          sudo tar --remove-files \
          -cf build.aarch64.tar ./build.ROCKNIX-${{ inputs.DEVICE }}.${{ env.ARCH }}/

      - uses: actions/upload-artifact@v7
        with:
          name: aarch64 (${{ inputs.DEVICE }})
          path: build.aarch64.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64 build (${{ inputs.DEVICE }})
          path: build.build.aarch64.tar
          if-no-files-found: error
